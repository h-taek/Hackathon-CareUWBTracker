<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돌봄시설 실시간 위치 관제</title>
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/dashboard.css" />
<!-- 3D 패널이 쓰는 모듈 해석표. vendor/는 정적 동봉이라 설치·번들 단계가 없다(plan/07).
     임포트 맵은 첫 모듈 스크립트보다 반드시 앞서야 한다. -->
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.min.js",
    "@mkkellogg/gaussian-splats-3d": "/vendor/gaussian-splats-3d/gaussian-splats-3d.module.js"
  }
}
</script>
<script src="/assets/js/dashboard.js" type="module"></script>
</head>
<body>

<div class="topbar">
  <button class="navtoggle" id="navToggle" aria-label="사이드바 접기/펼치기">▐</button>
  <div class="brand"><span class="av" aria-hidden="true"></span><span class="brandcopy">Care<span>UWB</span><small>UWB 기반 낙상 감지 시스템</small></span></div>
  <div class="title">웅진관 2층 <small id="floorRange">· 실시간 관제</small></div>
  <div class="legend">
    <span><i class="sw" style="background:var(--ok)"></i>정상</span>
    <span><i class="sw" style="background:var(--offline)"></i>오프라인</span>
    <span><i class="sw" style="background:var(--alarm)"></i>이상 감지</span>
    <span><i class="sw" style="background:var(--sel)"></i>선택한 환자</span>
  </div>
  <span class="spacer"></span>
  <span class="conn" id="conn"><span class="dot"></span><span id="connText">연결 중…</span></span>
  <span class="state-pill" id="statePill">idle (2D)</span>
  <!-- 사고 기록은 관제와 별개 화면이다. 경보 흐름에 3D를 끼우지 않는다(plan/07 §4). -->
  <a class="btn" href="/recon" style="text-decoration:none">사고 현장 3D 기록</a>
  <button class="btn exit">나가기</button>
</div>

<div class="shell" id="shell">
  <!-- 좌: 필터 + 층 목록 -->
  <div class="col col-left">
    <div class="card">
      <div class="chips">
        <span class="chip"><i class="sw" style="background:var(--ok)"></i>연결 <b id="cntOk">0</b></span>
        <span class="chip"><i class="sw" style="background:var(--offline)"></i>끊김 <b id="cntOff">0</b></span>
        <span class="chip"><i class="sw" style="background:var(--alarm)"></i>이벤트 <b id="cntEvt">0</b></span>
      </div>
    </div>
    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <h2>층별 목록</h2>
      <div class="floors" id="floors">
        <div class="floor" open id="floor1">
          <button class="fhead" type="button">
            <span class="fnum">f1</span>
            <span class="fmeta"><span class="t" id="f1Range">—</span><span class="s" id="f1Count">환자 0명</span></span>
            <span class="badge" id="f1Badge">연결 0명</span>
          </button>
          <div class="rooms" id="f1Rooms"><span class="empty">태그 대기 중…</span></div>
        </div>
        <div class="floor pending">
          <button class="fhead" type="button"><span class="fnum">f2</span>
            <span class="fmeta"><span class="t">2층</span><span class="s">단층 맵</span></span>
            <span class="pending-tag">데이터 대기</span></button>
        </div>
        <div class="floor pending">
          <button class="fhead" type="button"><span class="fnum">f3</span>
            <span class="fmeta"><span class="t">3층</span><span class="s">단층 맵</span></span>
            <span class="pending-tag">데이터 대기</span></button>
        </div>
        <div class="floor pending">
          <button class="fhead" type="button"><span class="fnum">f4</span>
            <span class="fmeta"><span class="t">4층</span><span class="s">단층 맵</span></span>
            <span class="pending-tag">데이터 대기</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 중앙: 뷰포트 -->
  <div class="col col-center">
    <div class="card mapcard">
      <h2><span>실시간 위치 <b>(2D 평면도)</b></span><span id="viewMode" style="color:var(--faint);font-weight:400">2D 개요</span></h2>
      <div class="viewport" id="viewport">
        <div class="v3d">
          <!-- 스플랫 캔버스가 여기에 붙는다(assets/js/scene3d.js) -->
          <div class="v3d-stage" id="scene3dStage"></div>
          <div class="scene-tag">
            <span class="badge3d">3D 실사 뷰</span>
            <span class="badge3d" id="scene3dWho" style="background:rgba(248,81,73,.18);color:#ffc7c3">—</span>
          </div>
          <!-- 스텁 안내문·DOM 마커는 폐기: F3에서 실제 뷰어가 들어와 마커도 씬 안에서 그린다 -->
          <div class="scene-note" id="scene3dStatus"></div>
        </div>
        <div class="v2d" id="v2d">
          <span class="pip-label">2D 개요</span>
          <canvas id="map"></canvas>
        </div>
        <div class="banner">
          <div class="bell">🔔</div>
          <div class="k" id="bannerTitle">—<small id="bannerSub">—</small></div>
          <button class="bx" id="bannerClose" aria-label="배너 접기">✕</button>
        </div>
      </div>
      <div class="maplegend">
        <span><i class="sw" style="background:var(--ok)"></i>정상</span>
        <span><i class="sw" style="background:var(--alarm)"></i>경보</span>
        <span><i class="sw" style="background:var(--sel)"></i>선택</span>
        <span><i class="sw" style="background:var(--offline)"></i>오프라인</span>
        <span><i class="sw" style="background:var(--hazard);border-radius:2px"></i>위험구역</span>
        <span>원 = 오차 반경(err.xy)</span>
      </div>
      <!-- 데모 주입: 데이터셋 클립을 실제 ingest 경로로 흘린다. 경보는 감지기가 낸다. -->
      <div class="demobar" id="demobar">
        <span class="hint">클립 주입:</span>
        <!-- 클립 목록은 /clips 응답으로, 태그 버튼은 /tags 응답으로 dashboard.js가 채운다 -->
        <select id="clipPick" aria-label="주입할 데이터셋 클립"></select>
      </div>
      <div class="demostatus" id="clipStatus" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- 우: 알림 로그 -->
  <div class="col col-right">
    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <h2>알림 로그 <span id="logCount" style="color:var(--faint);font-weight:400"></span></h2>
      <div class="log" id="log"><span class="empty">아직 경보 없음</span></div>
    </div>
  </div>
</div>

<!-- 경보 팝업 -->
<div class="overlay" id="overlay">
  <div class="popup" id="popup" role="alert" aria-live="assertive">
    <button class="close" id="popClose" aria-label="팝업 감추기 (경보는 유지)">✕</button>
    <div class="top">
      <div class="bell" id="popIcon" aria-hidden="true">🚨</div>
      <div>
        <div class="k" id="popKind">낙상 감지</div>
        <div class="h" id="popWho">—</div>
        <div class="w" id="popWhere">—</div>
        <div class="time" id="popTime">—</div>
      </div>
    </div>
    <div class="acts">
      <button class="btn primary" id="popView3d">3D 실사 뷰 열기</button>
      <button class="btn" id="popDismiss">경보 종료</button>
    </div>
  </div>
</div>

</body>
</html>
